<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentGPT | Log In</title>
    <link rel="stylesheet" href="../bootstrap.css" />
    <style>
      :root {
        --bg: #0d1117;
        --panel: #111827;
        --panel-soft: rgba(15, 23, 42, 0.9);
        --line: rgba(148, 163, 184, 0.18);
        --muted: #94a3b8;
        --text: #e5edf7;
        --primary: #3b82f6;
        --primary-strong: #2563eb;
        --danger: #f87171;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.28), transparent 30%),
          radial-gradient(circle at bottom right, rgba(52, 211, 153, 0.16), transparent 30%),
          #0d1117;
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .page-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      .back-button-container {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--text);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
      }

      .back-btn:hover {
        background: rgba(15, 23, 42, 0.95);
        border-color: rgba(148, 163, 184, 0.35);
        transform: translateY(-2px);
      }

      .auth-shell {
        width: min(460px, calc(100% - 24px));
        margin-top: 60px;
      }

      .auth-card {
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 28px 80px rgba(2, 6, 23, 0.5);
        padding: 28px 26px 20px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        margin-bottom: 20px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #7c3aed, #22c55e);
        color: #f8fafc;
        font-weight: 800;
        box-shadow: 0 8px 22px rgba(124, 58, 237, 0.35);
      }

      .auth-card h1 {
        font-size: clamp(1.8rem, 3vw, 2.2rem);
        letter-spacing: -0.05em;
        margin-bottom: 18px;
      }

      .auth-subtitle {
        color: var(--muted);
        margin-bottom: 18px;
        line-height: 1.7;
      }

      .social-btn,
      .submit-btn,
      .inline-btn {
        width: 100%;
        border-radius: 12px;
        font-weight: 600;
      }

      .social-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 12px 18px;
        margin-bottom: 16px;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        margin: 18px 0 20px;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid var(--line);
      }

      .form-label {
        font-weight: 600;
      }

      .form-control {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--text);
        padding: 0.8rem 0.9rem;
      }

      .form-control::placeholder {
        color: #7f8ea3;
      }

      .input-missing {
        outline: 1px solid var(--danger);
        outline-offset: 3px;
      }

      .validation-message {
        color: #fca5a5;
        font-weight: 500;
        margin-top: 10px;
      }

      .shake {
        animation: shake 0.35s;
      }

      @keyframes shake {
        25% { transform: translateX(-8px); }
        50% { transform: translateX(8px); }
        75% { transform: translateX(-5px); }
      }

      .password-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .password-group .form-control {
        flex: 1;
      }

      .inline-btn {
        width: auto;
        min-width: 52px;
        padding: 0.8rem 0.9rem;
        background: rgba(59, 130, 246, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.25);
        color: var(--text);
      }

      .submit-btn {
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        border: none;
        color: white;
        padding: 0.9rem 1rem;
        margin-top: 18px;
      }

      .status-message {
        min-height: 24px;
        margin-top: 14px;
        font-size: 0.92rem;
      }

      .text-danger {
        color: #fca5a5 !important;
      }

      .text-success {
        color: #86efac !important;
      }

      .text-muted {
        color: var(--muted) !important;
      }

      .switch-link {
        text-align: center;
        margin-top: 18px;
        color: var(--muted);
      }

      .switch-link a {
        color: #bfdbfe;
        text-decoration: none;
      }

      @media (max-width: 640px) {
        .back-button-container {
          top: 12px;
          left: 12px;
        }

        .back-btn {
          padding: 8px 12px;
          font-size: 0.85rem;
        }

        .auth-shell {
          margin-top: 70px;
        }
      }
    </style>
  </head>
  <body>
    <div class="back-button-container">
      <a href="./StartMenu.html" class="back-btn">
        <span>←</span>
        <span>Back</span>
      </a>
    </div>

    <main class="page-wrapper">
      <div class="auth-shell">
        <div class="auth-card">
          <div class="brand" aria-label="StudentGPT brand">
            <span class="brand-mark">S</span>
            <span>StudentGPT</span>
          </div>

          <h1>Log in</h1>
          <p class="auth-subtitle">Access your workspace and continue with your local AI gateway.</p>

          <button type="button" class="social-btn" id="googleSignIn">Continue with Google</button>

          <div class="divider">or continue with email</div>

          <form id="loginForm" novalidate>
            <div>
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" placeholder="Enter email" required />
              <div id="emailError" class="validation-message d-none">You didn't fill out this option.</div>
            </div>

            <div class="mt-3">
              <label for="password" class="form-label">Password</label>
              <div id="passwordGroup" class="password-group">
                <input type="password" class="form-control" id="password" placeholder="Password" required />
                <button class="inline-btn" type="button" id="showPassword" aria-label="Show password">👁</button>
              </div>
              <div id="passwordError" class="validation-message d-none">You didn't fill out this option.</div>
            </div>

            <button type="submit" class="submit-btn">Log in</button>
            <p id="loginStatus" class="status-message" aria-live="polite"></p>
          </form>

          <p class="switch-link">Need an account? <a href="./SignUp.html">Sign up</a></p>
          <p class="switch-link">Forgot password? <a href="./ForgetUserPass.html">Reset it here</a></p>
        </div>
      </div>
    </main>

    <script type="module" src="../javascript/signin.js"></script>
  </body>
</html>
